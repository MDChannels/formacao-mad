<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formação MAD · Aula 3 — Quiz de Fixação (Temas e Micronichos)</title>
<style>
  :root{
    --bg:#0F1115; --panel:#171A21; --panel2:#1E222B; --ink:#F3F5F8; --muted:#9AA0A8;
    --yellow:#FFD23F; --green:#2ecc71; --red:#ff5b5b; --line:#272C37; --accent:#26BDEA;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:#05060a; font-family:'Segoe UI',Helvetica,Arial,sans-serif; color:var(--ink);
       display:flex; justify-content:center; padding:40px 16px;}
  .wrap{width:100%; max-width:780px;}
  header{margin-bottom:22px;}
  .brand{font-size:13px; font-weight:800; letter-spacing:4px; color:var(--yellow);}
  .kicker{color:var(--muted); font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-top:6px;}
  h1{font-size:30px; margin-top:8px; letter-spacing:-.5px;}
  .sub{color:var(--muted); margin-top:8px; font-size:16px; line-height:1.5;}
  .progress{height:8px; background:var(--panel); border-radius:6px; margin:20px 0 4px; overflow:hidden;}
  .progress > i{display:block; height:100%; width:0; background:var(--yellow); transition:width .3s;}
  .pmeta{color:var(--muted); font-size:13px; text-align:right;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:24px 24px; margin-top:18px;}
  .qnum{color:var(--yellow); font-size:13px; font-weight:700; letter-spacing:1.5px;}
  .tagline{display:inline-block; margin-left:8px; font-size:11px; font-weight:700; letter-spacing:1px; color:var(--accent);
           border:1px solid rgba(38,189,234,.4); border-radius:999px; padding:2px 9px; vertical-align:middle;}
  .qtext{font-size:20px; font-weight:600; margin:10px 0 6px; line-height:1.35;}
  .scenario{background:#0c0e13; border:1px dashed var(--line); border-radius:10px; padding:14px 16px; margin:12px 0 16px;
            font-size:15px; color:#cfd4dc; line-height:1.55;}
  .scenario b{color:#fff;} .scenario .li{display:block; margin:3px 0;}
  .opt{display:block; width:100%; text-align:left; background:var(--panel2); border:1px solid var(--line);
       color:var(--ink); font-size:16px; padding:14px 18px; border-radius:11px; margin-bottom:10px; cursor:pointer;
       transition:border-color .15s, background .15s;}
  .opt:hover:not(:disabled){border-color:var(--yellow);}
  .opt:disabled{cursor:default;}
  .opt.correct{border-color:var(--green); background:rgba(46,204,113,.14);}
  .opt.wrong{border-color:var(--red); background:rgba(255,91,91,.12);}
  .opt .mark{float:right; font-weight:800;}
  .fb{margin-top:6px; font-size:15px; line-height:1.5; padding:14px 16px; border-radius:11px; display:none;}
  .fb.show{display:block;}
  .fb.ok{background:rgba(46,204,113,.10); border:1px solid rgba(46,204,113,.4);}
  .fb.no{background:rgba(255,91,91,.08); border:1px solid rgba(255,91,91,.35);}
  .fb b{color:var(--yellow);}
  .result{background:linear-gradient(135deg,#1a1d25,#111319); border:1px solid var(--yellow);
          border-radius:18px; padding:34px; margin-top:24px; text-align:center; display:none;}
  .result.show{display:block;}
  .score{font-size:56px; font-weight:900; color:var(--yellow);}
  .rlabel{font-size:19px; margin-top:6px;} .rmsg{color:var(--muted); margin-top:14px; font-size:16px; line-height:1.5;}
  .btn{margin-top:20px; background:var(--yellow); color:#05060a; border:none; font-weight:800; font-size:16px;
       padding:13px 26px; border-radius:999px; cursor:pointer;}
  footer{color:#565d6b; font-size:13px; text-align:center; margin-top:24px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">FORMAÇÃO MAD</div>
    <div class="kicker">Módulo 5 · Aula 3 · Fixação</div>
    <h1>Quiz — Temas e Micronichos</h1>
    <div class="sub">Tem bastante <b style="color:#fff">treino no olho</b>: dado um subnicho, separe o que é tema válido do que é mistura. O feedback aparece na hora.</div>
    <div class="progress"><i id="bar"></i></div>
    <div class="pmeta"><span id="answered">0</span>/<span id="total">0</span> respondidas</div>
  </header>

  <div id="quiz"></div>

  <div class="result" id="result">
    <div class="score"><span id="scoreN">0</span>/<span id="scoreT">0</span></div>
    <div class="rlabel" id="rlabel"></div>
    <div class="rmsg" id="rmsg"></div>
    <button class="btn" onclick="location.reload()">Refazer o quiz</button>
  </div>

  <footer>Formação MAD · Módulo 5, Aula 3 — Canal Dark</footer>
</div>

<script>
const QUESTIONS = [
  {
    q: "Na definição prática desta formação, o que é um TEMA?",
    options: [
      "Cada assunto recorrente que você aborda dentro do subnicho",
      "Um nicho totalmente novo",
      "A cor da thumbnail",
      "O horário de postagem"
    ],
    correct: 0,
    exp: "Tema é a variedade dentro do foco: os assuntos recorrentes que você entrega para a mesma pessoa do subnicho."
  },
  {
    q: "Segundo a visão do instrutor, tema e micronicho são:",
    options: [
      "Coisas opostas",
      "A mesma coisa na prática — o assunto ultra-específico entregue à mesma pessoa",
      "Sinônimos de nicho",
      "Formatos de edição"
    ],
    correct: 1,
    exp: "Os termos são subjetivos. Aqui tratamos tema = micronicho: o que importa é se serve a mesma pessoa do subnicho."
  },
  {
    q: "De onde deve vir a VARIEDADE de um canal?",
    options: [
      "De trocar de público a cada vídeo",
      "Dos temas dentro do mesmo subnicho (mesma pessoa)",
      "De copiar canais de outros nichos",
      "De postar em horários diferentes"
    ],
    correct: 1,
    exp: "Regra de ouro (Aula 2): variedade vem dos temas, não de trocar de público. Muitos assuntos, uma só pessoa."
  },
  {
    q: "Qual é o TESTE do tema válido?",
    options: [
      "O assunto é popular no momento?",
      "O assunto rende muitas views em qualquer canal?",
      "O assunto atrai a MESMA pessoa do meu subnicho?",
      "O assunto tem CPM alto?"
    ],
    correct: 2,
    exp: "Se atrai a mesma pessoa do subnicho → é tema. Se atrai outra pessoa → é mistura (o erro da Aula 2)."
  },
  {
    q: "Ache o INTRUSO. Subnicho: histórias reais de terror. Qual NÃO é um tema válido?",
    scenario: "<span class='li'>A) Invasões domiciliares</span><span class='li'>B) Terror em trilha e camping</span><span class='li'>C) Review dos melhores notebooks de 2026</span><span class='li'>D) Histórias de babá assustadoras</span>",
    options: ["A","B","C","D"],
    correct: 2,
    exp: "C atrai outra pessoa (quem quer comprar notebook), não o fã de terror. Assunto popular, mas fora do público = mistura, não tema."
  },
  {
    q: "Ache o INTRUSO. Subnicho: sair das dívidas. Qual NÃO é um tema válido?",
    scenario: "<span class='li'>A) Como montar um orçamento pra quitar dívidas</span><span class='li'>B) Histórias de quem saiu do vermelho</span><span class='li'>C) Erros que afundam quem está endividado</span><span class='li'>D) As melhores criptomoedas pra ficar rico rápido</span>",
    options: ["A","B","C","D"],
    correct: 3,
    exp: "D fala com o especulador/investidor, não com o endividado. Muda a pessoa → é mistura, mesmo sendo do nicho de finanças."
  },
  {
    q: "Quantos “pilares de conteúdo” (temas centrais) o mercado costuma recomendar?",
    options: [
      "1 só",
      "Entre 3 e 6",
      "Pelo menos 20",
      "Quanto mais, melhor — sem limite"
    ],
    correct: 1,
    exp: "A referência comum é de 3 a 6 pilares. Poucos o bastante pra manter foco, muitos o bastante pra não faltar ideia."
  },
  {
    q: "Como gerar dezenas de temas para um subnicho?",
    options: [
      "Copiando aleatoriamente vídeos virais de qualquer nicho",
      "Partindo da persona: listando suas dúvidas, dores, desejos, erros e histórias",
      "Escolhendo assuntos que você gosta, mesmo que sejam de outro público",
      "Trocando de subnicho toda semana"
    ],
    correct: 1,
    exp: "A persona é a mina de ouro: cada dúvida/dor/desejo/erro/história vira um tema, e cada tema vira dezenas de vídeos."
  },
  {
    q: "Por que um micronicho é especialmente bom para quem está começando?",
    options: [
      "Porque tem menos concorrência, público mais fiel e é mais fácil virar autoridade",
      "Porque o YouTube paga mais por micronicho",
      "Porque não precisa de constância",
      "Porque dispensa ter um subnicho"
    ],
    correct: 0,
    exp: "Micronicho reduz a briga com gigantes, atrai um público passional e acelera a autoridade — vantagem real pro iniciante."
  },
  {
    q: "Qual é o RISCO de escolher um micronicho estreito demais?",
    options: [
      "O CPM zera",
      "O conteúdo acaba: você não gera temas suficientes e o teto de audiência fica baixo",
      "O canal é banido",
      "Não existe risco nenhum"
    ],
    correct: 1,
    exp: "Estreito demais seca. Se não dá pra listar dezenas de temas para aquele público, o micronicho é pequeno demais pra sustentar um canal."
  },
  {
    q: "Teste rápido de “ponto certo”: um bom subnicho/micronicho é aquele em que você consegue…",
    options: [
      "Listar 20+ temas para a mesma pessoa sem repetir",
      "Postar em 5 nichos diferentes",
      "Falar de qualquer assunto que aparecer",
      "Fazer só 3 vídeos no total"
    ],
    correct: 0,
    exp: "Se dá pra listar 20+ temas servindo a mesma pessoa, você tem foco E combustível. Amplo demais vira mistura; estreito demais seca."
  }
];

const quiz = document.getElementById('quiz');
const bar = document.getElementById('bar');
const answeredEl = document.getElementById('answered');
document.getElementById('total').textContent = QUESTIONS.length;
document.getElementById('scoreT').textContent = QUESTIONS.length;
let answered = 0, score = 0;

QUESTIONS.forEach((item, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  const isEye = !!item.scenario;
  card.innerHTML = `<div class="qnum">PERGUNTA ${i+1}${isEye ? '<span class="tagline">TREINO NO OLHO</span>' : ''}</div>`
    + `<div class="qtext">${item.q}</div>`
    + (item.scenario ? `<div class="scenario">${item.scenario}</div>` : '');
  const fb = document.createElement('div');
  fb.className = 'fb';
  item.options.forEach((opt, j) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = opt;
    b.onclick = () => choose(card, fb, item, j, b);
    card.appendChild(b);
  });
  card.appendChild(fb);
  quiz.appendChild(card);
});

function choose(card, fb, item, ji, btn){
  if(card.dataset.done) return;
  card.dataset.done = "1";
  const buttons = card.querySelectorAll('.opt');
  buttons.forEach((b,idx)=>{
    b.disabled = true;
    if(idx === item.correct){ b.classList.add('correct'); b.insertAdjacentHTML('beforeend','<span class="mark">✓</span>'); }
  });
  const ok = ji === item.correct;
  if(ok){ score++; } else { btn.classList.add('wrong'); btn.insertAdjacentHTML('beforeend','<span class="mark">✗</span>'); }
  fb.classList.add('show', ok ? 'ok':'no');
  fb.innerHTML = (ok ? '<b>Correto!</b> ' : '<b>Quase.</b> ') + item.exp;
  answered++;
  answeredEl.textContent = answered;
  bar.style.width = (answered/QUESTIONS.length*100) + '%';
  if(answered === QUESTIONS.length) finish();
}

function finish(){
  const r = document.getElementById('result');
  document.getElementById('scoreN').textContent = score;
  const pct = score/QUESTIONS.length;
  let label, msg;
  if(pct === 1){ label="Dominou! 🎯"; msg="Você separa tema de mistura e sabe gerar conteúdo sem sair do foco. Pronto para a Aula 4 (Formatos)."; }
  else if(pct >= 0.75){ label="Muito bom!"; msg="Base sólida. Revise os exercícios de intruso que errou e siga para a Aula 4."; }
  else if(pct >= 0.5){ label="No caminho."; msg="Reforce o “teste do tema válido” (mesma pessoa?) e refaça — é o coração da aula."; }
  else { label="Bora reforçar."; msg="Sem crise. Reassista os slides de teste do tema e de como gerar temas, e treine o olho de novo."; }
  document.getElementById('rlabel').textContent = label;
  document.getElementById('rmsg').textContent = msg;
  r.classList.add('show');
  r.scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
