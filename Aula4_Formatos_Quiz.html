<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formação MAD · Aula 4 — Quiz de Fixação (Formatos)</title>
<style>
  :root{
    --bg:#0F1115; --panel:#171A21; --panel2:#1E222B; --ink:#F3F5F8; --muted:#9AA0A8;
    --yellow:#FFD23F; --green:#2ecc71; --red:#ff5b5b; --line:#272C37; --accent:#26BDEA;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:#05060a; font-family:'Segoe UI',Helvetica,Arial,sans-serif; color:var(--ink);
       display:flex; justify-content:center; padding:40px 16px;}
  .wrap{width:100%; max-width:780px;}
  header{margin-bottom:22px;}
  .brand{font-size:13px; font-weight:800; letter-spacing:4px; color:var(--yellow);}
  .kicker{color:var(--muted); font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-top:6px;}
  h1{font-size:30px; margin-top:8px; letter-spacing:-.5px;}
  .sub{color:var(--muted); margin-top:8px; font-size:16px; line-height:1.5;}
  .progress{height:8px; background:var(--panel); border-radius:6px; margin:20px 0 4px; overflow:hidden;}
  .progress > i{display:block; height:100%; width:0; background:var(--yellow); transition:width .3s;}
  .pmeta{color:var(--muted); font-size:13px; text-align:right;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:24px 24px; margin-top:18px;}
  .qnum{color:var(--yellow); font-size:13px; font-weight:700; letter-spacing:1.5px;}
  .tagline{display:inline-block; margin-left:8px; font-size:11px; font-weight:700; letter-spacing:1px; color:var(--accent);
           border:1px solid rgba(38,189,234,.4); border-radius:999px; padding:2px 9px; vertical-align:middle;}
  .qtext{font-size:20px; font-weight:600; margin:10px 0 6px; line-height:1.35;}
  .scenario{background:#0c0e13; border:1px dashed var(--line); border-radius:10px; padding:14px 16px; margin:12px 0 16px;
            font-size:15px; color:#cfd4dc; line-height:1.55;}
  .scenario b{color:#fff;} .scenario .li{display:block; margin:3px 0;}
  .opt{display:block; width:100%; text-align:left; background:var(--panel2); border:1px solid var(--line);
       color:var(--ink); font-size:16px; padding:14px 18px; border-radius:11px; margin-bottom:10px; cursor:pointer;
       transition:border-color .15s, background .15s;}
  .opt:hover:not(:disabled){border-color:var(--yellow);}
  .opt:disabled{cursor:default;}
  .opt.correct{border-color:var(--green); background:rgba(46,204,113,.14);}
  .opt.wrong{border-color:var(--red); background:rgba(255,91,91,.12);}
  .opt .mark{float:right; font-weight:800;}
  .fb{margin-top:6px; font-size:15px; line-height:1.5; padding:14px 16px; border-radius:11px; display:none;}
  .fb.show{display:block;}
  .fb.ok{background:rgba(46,204,113,.10); border:1px solid rgba(46,204,113,.4);}
  .fb.no{background:rgba(255,91,91,.08); border:1px solid rgba(255,91,91,.35);}
  .fb b{color:var(--yellow);}
  .result{background:linear-gradient(135deg,#1a1d25,#111319); border:1px solid var(--yellow);
          border-radius:18px; padding:34px; margin-top:24px; text-align:center; display:none;}
  .result.show{display:block;}
  .score{font-size:56px; font-weight:900; color:var(--yellow);}
  .rlabel{font-size:19px; margin-top:6px;} .rmsg{color:var(--muted); margin-top:14px; font-size:16px; line-height:1.5;}
  .btn{margin-top:20px; background:var(--yellow); color:#05060a; border:none; font-weight:800; font-size:16px;
       padding:13px 26px; border-radius:999px; cursor:pointer;}
  footer{color:#565d6b; font-size:13px; text-align:center; margin-top:24px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">FORMAÇÃO MAD</div>
    <div class="kicker">Módulo 5 · Aula 4 · Fixação</div>
    <h1>Quiz — O que são Formatos</h1>
    <div class="sub">Formato é o <b style="color:#fff">como</b>. Aqui você fixa a diferença entre formato e nicho, a lógica da barreira, e treina a identificar formatos no olho.</div>
    <div class="progress"><i id="bar"></i></div>
    <div class="pmeta"><span id="answered">0</span>/<span id="total">0</span> respondidas</div>
  </header>

  <div id="quiz"></div>

  <div class="result" id="result">
    <div class="score"><span id="scoreN">0</span>/<span id="scoreT">0</span></div>
    <div class="rlabel" id="rlabel"></div>
    <div class="rmsg" id="rmsg"></div>
    <button class="btn" onclick="location.reload()">Refazer o quiz</button>
  </div>

  <footer>Formação MAD · Módulo 5, Aula 4 — Canal Dark</footer>
</div>

<script>
const QUESTIONS = [
  {
    q: "O que é um FORMATO?",
    options: [
      "A forma como você entrega o nicho, subnicho e temas (o “como”)",
      "O público específico do canal",
      "O assunto de um vídeo",
      "A quantidade de inscritos"
    ],
    correct: 0,
    exp: "Formato é o “como”: a forma de entregar. Nicho/subnicho/tema são o “o quê / pra quem”; o formato veste tudo isso."
  },
  {
    q: "O formato SUBSTITUI o nicho?",
    options: [
      "Sim, se o formato é bom o nicho não importa",
      "Não — o formato entrega o nicho/subnicho/tema; você precisa dos dois",
      "Sim, nicho é coisa de iniciante",
      "Não, porque formato e nicho são a mesma coisa"
    ],
    correct: 1,
    exp: "Posição da Formação MAD: formato é o corpo, nicho/subnicho/tema é o que você entrega nesse corpo. Um decide pra quem, o outro decide como."
  },
  {
    q: "Por que se diz que um bom formato é “portátil”?",
    options: [
      "Porque pode ser assistido no celular",
      "Porque o mesmo formato pode ser aplicado a vários nichos diferentes",
      "Porque não precisa de edição",
      "Porque dispensa ter público"
    ],
    correct: 1,
    exp: "“Every ___ Explained” serve ferramentas, peças de carro ou componentes de PC. O formato viaja entre nichos — mas cada canal ainda fala com uma pessoa só."
  },
  {
    q: "Música e história, na visão da formação, são:",
    options: [
      "Nichos",
      "Formatos — formas de entregar um assunto",
      "Subnichos",
      "Temas"
    ],
    correct: 1,
    exp: "São formas de entregar (formatos), não o assunto em si. O mesmo formato “história” aparece em finanças, terror, etc."
  },
  {
    q: "O que é a BARREIRA DE ENTRADA de um formato?",
    options: [
      "O preço do plano premium do YouTube",
      "A skill, o processo e a complexidade que o formato exige pra ser produzido",
      "O número mínimo de inscritos pra monetizar",
      "O tempo de duração do vídeo"
    ],
    correct: 1,
    exp: "Barreira = o quão difícil é produzir aquele formato. É o eixo que separa um negócio sólido de um castelo de areia."
  },
  {
    q: "O que a barreira ALTA traz de vantagem?",
    options: [
      "Nada — só dá trabalho",
      "Menos concorrência, resultado mais duradouro e mais resistência ao “facão” do YouTube",
      "Monetização automática",
      "Dispensa constância"
    ],
    correct: 1,
    exp: "Difícil de copiar = poucos concorrentes e canal mais sólido. Por isso a dificuldade compensa: alta barreira = quase sem concorrência."
  },
  {
    q: "Por que formatos de BAIXA barreira (imagem+legenda, fake news, ranking de cards) são arriscados?",
    options: [
      "Porque ninguém assiste",
      "Porque qualquer um faz → saturam rápido e vivem na mira das políticas (facão do YouTube)",
      "Porque são caros de produzir",
      "Porque o YouTube não monetiza vídeo nenhum"
    ],
    correct: 1,
    exp: "Fácil demais = todo mundo copia, o efeito morre e o YouTube corta. Podem dar grana curta, mas é castelo de areia."
  },
  {
    q: "O que é o “efeito de novidade” de um formato?",
    options: [
      "Um recurso de edição do YouTube",
      "O impulso que um formato tem enquanto é novo/inédito, e que cai conforme satura",
      "A idade mínima do canal",
      "Um tipo de anúncio"
    ],
    correct: 1,
    exp: "Formato novo bomba pelo ineditismo. Baixa barreira satura em semanas; alta barreira segura o diferencial por muito mais tempo."
  },
  {
    q: "Identifique o formato (no olho):",
    scenario: "<b>Canal:</b> posta “Every Nut & Bolt Explained in 10 Minutes”, “Every Drill Bit Explained in 7 Minutes”, “Every Angle Grinder Disc Explained in 11 Minutes”.<span class='li'>Thumbnail sempre em grade com os itens etiquetados; cada vídeo cobre uma categoria nova.</span>",
    options: [
      "Vlog",
      "Reação",
      "Catálogo sequencial",
      "Entrevista"
    ],
    correct: 2,
    exp: "Fôrma fixa + coleção que cresce categoria após categoria = catálogo sequencial (ex.: Workshop Decoded). Processo repetível e escalável."
  },
  {
    q: "Qual destes é uma DIVISÃO dentro do formato “música”?",
    options: [
      "1ª pessoa vs 3ª pessoa",
      "Single, Clip (lip sync) e Playlist extensa (1h+)",
      "Fake news vs real",
      "Tier list"
    ],
    correct: 1,
    exp: "Dentro de música: single (uma faixa), clip (personagem em lip sync), playlist longa, mix temático. 1ª/3ª pessoa é divisão de história."
  },
  {
    q: "Tier list e vlog são exemplos de…",
    options: [
      "Nichos",
      "Formatos de conteúdo",
      "Subnichos",
      "Temas"
    ],
    correct: 1,
    exp: "São formas de entregar conteúdo = formatos. Quase tudo que se repete numa fôrma (tier list, vlog, reação, tutorial) é um formato."
  }
];

const quiz = document.getElementById('quiz');
const bar = document.getElementById('bar');
const answeredEl = document.getElementById('answered');
document.getElementById('total').textContent = QUESTIONS.length;
document.getElementById('scoreT').textContent = QUESTIONS.length;
let answered = 0, score = 0;

QUESTIONS.forEach((item, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  const isEye = !!item.scenario;
  card.innerHTML = `<div class="qnum">PERGUNTA ${i+1}${isEye ? '<span class="tagline">TREINO NO OLHO</span>' : ''}</div>`
    + `<div class="qtext">${item.q}</div>`
    + (item.scenario ? `<div class="scenario">${item.scenario}</div>` : '');
  const fb = document.createElement('div');
  fb.className = 'fb';
  item.options.forEach((opt, j) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = opt;
    b.onclick = () => choose(card, fb, item, j, b);
    card.appendChild(b);
  });
  card.appendChild(fb);
  quiz.appendChild(card);
});

function choose(card, fb, item, ji, btn){
  if(card.dataset.done) return;
  card.dataset.done = "1";
  const buttons = card.querySelectorAll('.opt');
  buttons.forEach((b,idx)=>{
    b.disabled = true;
    if(idx === item.correct){ b.classList.add('correct'); b.insertAdjacentHTML('beforeend','<span class="mark">✓</span>'); }
  });
  const ok = ji === item.correct;
  if(ok){ score++; } else { btn.classList.add('wrong'); btn.insertAdjacentHTML('beforeend','<span class="mark">✗</span>'); }
  fb.classList.add('show', ok ? 'ok':'no');
  fb.innerHTML = (ok ? '<b>Correto!</b> ' : '<b>Quase.</b> ') + item.exp;
  answered++;
  answeredEl.textContent = answered;
  bar.style.width = (answered/QUESTIONS.length*100) + '%';
  if(answered === QUESTIONS.length) finish();
}

function finish(){
  const r = document.getElementById('result');
  document.getElementById('scoreN').textContent = score;
  const pct = score/QUESTIONS.length;
  let label, msg;
  if(pct === 1){ label="Dominou! 🎯"; msg="Você entende formato como camada de entrega e usa a barreira a seu favor. Pronto para a Aula 5 (Estéticas)."; }
  else if(pct >= 0.75){ label="Muito bom!"; msg="Base sólida. Revise o que errou (barreira e divisões) e siga para a Aula 5."; }
  else if(pct >= 0.5){ label="No caminho."; msg="Reforce a ideia de que formato NÃO substitui nicho e o papel da barreira. Depois refaça."; }
  else { label="Bora reforçar."; msg="Sem crise. Reassista os slides de definição, barreira e divisões, e treine o olho de novo."; }
  document.getElementById('rlabel').textContent = label;
  document.getElementById('rmsg').textContent = msg;
  r.classList.add('show');
  r.scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
